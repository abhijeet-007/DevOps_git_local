version: '3.8'
services:
  web:
    build: .
    ports:
      - "5009:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=development
    depends_on:
      - redis
      - postgres

  python:
    build: .
    command: python app.py
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=development
    depends_on:
      - redis
      - postgres

  redis:  
    image: "redis:alpine"

  postgres:
    image: "postgres:alpine"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb